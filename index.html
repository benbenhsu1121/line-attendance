<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>師傅出勤打卡</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; background: #eee; }
    h2 { margin: 0 0 4px; color: #333; }
    p.sub { margin: 0 0 20px; color: #888; font-size: 14px; }
    .info-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 20px; text-align: left; font-size: 13px; color: #555; }
    .btn-group { display: flex; gap: 12px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-in { background-color: #00c300; color: white; }
    .btn-out { background-color: #e04b4b; color: white; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 13px; color: #666; }
  </style>
</head>
<body>

<div class="card">
  <img id="userPicture" class="avatar" src="https://via.placeholder.com/72" alt="頭像">
  <h2 id="userName">載入中...</h2>
  <p class="sub" id="userUid">LINE ID: 取得中...</p>

  <div class="info-box">
    <div><strong>打卡時間：</strong><span id="currentTime">--:--:--</span></div>
    <div><strong>目前位置：</strong><span id="locAddress">定位中...</span></div>
  </div>

  <div class="btn-group">
    <button id="btnIn" class="btn-in" onclick="submitCheckIn('clock_in')" disabled>上班打卡</button>
    <button id="btnOut" class="btn-out" onclick="submitCheckIn('clock_out')" disabled>下班打卡</button>
  </div>

  <div id="status">正在取得系統授權與定位...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQ98ZWCC0k7ALopTQKjpizcgeyiRu12_I",
    authDomain: "payroll-attendance-da6b1.firebaseapp.com",
    projectId: "payroll-attendance-da6b1",
    storageBucket: "payroll-attendance-da6b1.firebasestorage.app",
    messagingSenderId: "697411530182",
    appId: "1:697411530182:web:82a967282a51148c0016c7",
    measurementId: "G-126PX9RFPE"
  };

  const MY_LIFF_ID = "2011667192-mzmPgQFd";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentCoords = null;
  let currentAddress = "未知地址";
  let currentUser = { userId: "", displayName: "" };

  setInterval(() => {
    const now = new Date();
    document.getElementById("currentTime").innerText = now.toLocaleTimeString();
  }, 1000);

  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      const profile = await liff.getProfile();
      currentUser.userId = profile.userId;
      currentUser.displayName = profile.displayName;

      document.getElementById("userName").innerText = profile.displayName;
      document.getElementById("userUid").innerText = `ID: ${profile.userId}`;
      if (profile.pictureUrl) {
        document.getElementById("userPicture").src = profile.pictureUrl;
      }

      getLocation();
    } catch (err) {
      document.getElementById("status").innerText = "LINE 授權失敗: " + err.message;
    }
  }

  function getLocation() {
    if (!navigator.geolocation) {
      document.getElementById("status").innerText = "瀏覽器不支援定位";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        currentCoords = {
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude
        };
        await reverseGeocode(currentCoords.latitude, currentCoords.longitude);
      },
      (err) => {
        document.getElementById("status").innerText = "定位失敗，請確認已開放 GPS 權限";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  async function reverseGeocode(lat, lon) {
    try {
      document.getElementById("locAddress").innerText = "正在解析地址...";
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
        headers: { "Accept-Language": "zh-TW" }
      });
      const data = await res.json();
      currentAddress = data.display_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      document.getElementById("locAddress").innerText = currentAddress;

      document.getElementById("btnIn").disabled = false;
      document.getElementById("btnOut").disabled = false;
      document.getElementById("status").innerText = "準備就緒，請點選打卡";
    } catch {
      currentAddress = `經緯度: (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
      document.getElementById("locAddress").innerText = currentAddress;
      document.getElementById("btnIn").disabled = false;
      document.getElementById("btnOut").disabled = false;
    }
  }

  window.submitCheckIn = async function(type) {
    document.getElementById("btnIn").disabled = true;
    document.getElementById("btnOut").disabled = true;
    document.getElementById("status").innerText = "打卡資料傳輸中...";

    try {
      await addDoc(collection(db, "check_ins"), {
        lineUserId: currentUser.userId,
        displayName: currentUser.displayName,
        type: type,
        latitude: currentCoords.latitude,
        longitude: currentCoords.longitude,
        address: currentAddress,
        timestamp: serverTimestamp(),
        syncedToLocal: false
      });

      alert(type === "clock_in" ? "上班打卡成功！" : "下班打卡成功！");
      document.getElementById("status").innerText = "打卡成功，視窗即將關閉...";
      setTimeout(() => { liff.closeWindow(); }, 1500);
    } catch (e) {
      alert("打卡失敗: " + e.message);
      document.getElementById("btnIn").disabled = false;
      document.getElementById("btnOut").disabled = false;
      document.getElementById("status").innerText = "傳輸失敗，請重試";
    }
  };

  initLiff();
</script>
</body>
</html>

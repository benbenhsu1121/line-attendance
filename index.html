<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>師傅出勤打卡</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; background: #eee; }
    h2 { margin: 0 0 4px; color: #333; }
    p.sub { margin: 0 0 16px; color: #888; font-size: 13px; }
    .info-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 12px; margin-bottom: 16px; text-align: left; font-size: 13px; color: #444; }
    .info-row { margin-bottom: 6px; }
    .site-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .site-inside { background: #e6f9e6; color: #1e7e34; }
    .site-outside { background: #fff3cd; color: #856404; }
    .btn-group { display: flex; gap: 12px; margin-top: 12px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-in { background-color: #00c300; color: white; }
    .btn-out { background-color: #e04b4b; color: white; }
    .btn-warning { background-color: #ff9800; color: white; }
    button:disabled { background-color: #ccc !important; cursor: not-allowed; }
    #remoteReasonBox { display: none; margin-top: 12px; text-align: left; }
    #remoteReasonBox input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; margin-top: 4px; }
    #status { margin-top: 16px; font-size: 13px; color: #666; }
  </style>
</head>
<body>

<div class="card">
  <img id="userPicture" class="avatar" src="https://via.placeholder.com/72" alt="頭像">
  <h2 id="userName">載入中...</h2>
  <p class="sub" id="userUid">LINE ID: 取得中...</p>

  <div class="info-box">
    <div class="info-row"><strong>打卡時間：</strong><span id="currentTime">--:--:--</span></div>
    <div class="info-row"><strong>目前位置：</strong><span id="locAddress">定位中...</span></div>
    <div class="info-row"><strong>工地比對：</strong><span id="siteStatus" class="site-badge site-outside">檢測中...</span></div>
  </div>

  <!-- 超出範圍時顯示的報備輸入框 -->
  <div id="remoteReasonBox">
    <label style="font-size: 12px; color: #d9534f; font-weight: bold;">⚠️ 超出工地範圍，請輸入外勤/派遣原因：</label>
    <input type="text" id="overrideReason" placeholder="例如：主管口頭調派至某工地、材料行" value="主管臨時調派">
  </div>

  <div class="btn-group">
    <button id="btnIn" class="btn-in" onclick="submitCheckIn('clock_in')" disabled>上班打卡</button>
    <button id="btnOut" class="btn-out" onclick="submitCheckIn('clock_out')" disabled>下班打卡</button>
  </div>

  <div id="status">正在取得系統授權與定位...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQ98ZWCC0k7ALopTQKjpizcgeyiRu12_I",
    authDomain: "payroll-attendance-da6b1.firebaseapp.com",
    projectId: "payroll-attendance-da6b1",
    storageBucket: "payroll-attendance-da6b1.firebasestorage.app",
    messagingSenderId: "697411530182",
    appId: "1:697411530182:web:82a967282a51148c0016c7",
    measurementId: "G-126PX9RFPE"
  };

  const MY_LIFF_ID = "2011667192-mzmPgQFd";

  // 🌟 1. 設定你的工地清單（名稱、經緯度、允許半徑：公尺）
  const PROJECT_SITES = [
    { name: "料場", lat: 24.843132, lon: 120.935056, radius: 300 },
    { name: "倉庫", lat: 24.825496, lon: 120.972131, radius: 300 }
  ];

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentCoords = null;
  let currentAddress = "未知地址";
  let currentUser = { userId: "", displayName: "" };
  let matchedSite = null;
  let isOutOfRange = true;

  setInterval(() => {
    document.getElementById("currentTime").innerText = new Date().toLocaleTimeString();
  }, 1000);

  // Haversine 公式計算兩點經緯度距離（公尺）
  function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return Math.round(R * c);
  }

  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      const profile = await liff.getProfile();
      currentUser.userId = profile.userId;
      currentUser.displayName = profile.displayName;

      document.getElementById("userName").innerText = profile.displayName;
      document.getElementById("userUid").innerText = `ID: ${profile.userId}`;
      if (profile.pictureUrl) {
        document.getElementById("userPicture").src = profile.pictureUrl;
      }

      getLocation();
    } catch (err) {
      document.getElementById("status").innerText = "LINE 授權失敗: " + err.message;
    }
  }

  function getLocation() {
    if (!navigator.geolocation) {
      document.getElementById("status").innerText = "瀏覽器不支援定位";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        currentCoords = {
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude
        };

        // 比對工地距離
        checkSiteFences(currentCoords.latitude, currentCoords.longitude);

        await reverseGeocode(currentCoords.latitude, currentCoords.longitude);
      },
      (err) => {
        document.getElementById("status").innerText = "定位失敗，請允許開啟 GPS 權限";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function checkSiteFences(userLat, userLon) {
    let nearestSite = null;
    let minDistance = Infinity;

    for (const site of PROJECT_SITES) {
      const dist = getDistanceInMeters(userLat, userLon, site.lat, site.lon);
      if (dist < minDistance) {
        minDistance = dist;
        nearestSite = { ...site, distance: dist };
      }
    }

    const siteBadge = document.getElementById("siteStatus");
    const reasonBox = document.getElementById("remoteReasonBox");

    if (nearestSite && nearestSite.distance <= nearestSite.radius) {
      // 🌟 在 300 公尺工地內
      isOutOfRange = false;
      matchedSite = nearestSite.name;
      siteBadge.className = "site-badge site-inside";
      siteBadge.innerText = `在【${nearestSite.name}】範圍內 (${nearestSite.distance}m)`;
      reasonBox.style.display = "none";
    } else {
      // ⚠️ 超出工地範圍（開放外勤報備）
      isOutOfRange = true;
      matchedSite = nearestSite ? `距最近工地【${nearestSite.name}】${nearestSite.distance}公尺` : "不在已知工地";
      siteBadge.className = "site-badge site-outside";
      siteBadge.innerText = `不在工地範圍內 (${nearestSite ? nearestSite.distance + 'm' : ''})`;
      reasonBox.style.display = "block";
    }
  }

  async function reverseGeocode(lat, lon) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
        headers: { "Accept-Language": "zh-TW" }
      });
      const data = await res.json();
      currentAddress = data.display_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      document.getElementById("locAddress").innerText = currentAddress;
    } catch {
      currentAddress = `經緯度: (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
      document.getElementById("locAddress").innerText = currentAddress;
    }

    document.getElementById("btnIn").disabled = false;
    document.getElementById("btnOut").disabled = false;
    document.getElementById("status").innerText = isOutOfRange ? "⚠️ 您目前不在工地，請輸入外勤原因後打卡" : "已就緒，請點選打卡";
  }

  window.submitCheckIn = async function(type) {
    document.getElementById("btnIn").disabled = true;
    document.getElementById("btnOut").disabled = true;
    document.getElementById("status").innerText = "打卡傳輸中...";

    const overrideReason = isOutOfRange ? (document.getElementById("overrideReason").value.trim() || "未填寫異地原因") : "";

    try {
      await addDoc(collection(db, "check_ins"), {
        lineUserId: currentUser.userId,
        displayName: currentUser.displayName,
        type: type,
        latitude: currentCoords.latitude,
        longitude: currentCoords.longitude,
        address: currentAddress,
        siteName: matchedSite,
        isOutOfRange: isOutOfRange,         // 是否超出範圍
        overrideReason: overrideReason,     // 外勤/派遣報備原因
        timestamp: serverTimestamp(),
        syncedToLocal: false
      });

      alert(type === "clock_in" ? "上班打卡成功！" : "下班打卡成功！");
      setTimeout(() => { liff.closeWindow(); }, 1200);
    } catch (e) {
      alert("打卡失敗: " + e.message);
      document.getElementById("btnIn").disabled = false;
      document.getElementById("btnOut").disabled = false;
      document.getElementById("status").innerText = "傳輸失敗，請重試";
    }
  };

  initLiff();
</script>
</body>
</html>
